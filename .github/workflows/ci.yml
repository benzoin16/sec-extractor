name: CI & Eval Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve]"

      - name: Ruff Code Quality & Formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Run Test Suite
        run: |
          pytest -v --cov=src --cov-report=term-missing

  eval-gate:
    name: Model Quality & Regression Gate
    runs-on: ubuntu-latest
    needs: [lint-and-test]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve]"

      - name: Start Mock Model Server
        run: |
          python -m src.serve.mock_server --port 8001 &
          # Poll until server responds
          for i in {1..30}; do
            if curl -s http://localhost:8001/v1/models > /dev/null; then
              echo "Mock model server is ready!"
              break
            fi
            echo "Waiting for server to start..."
            sleep 1
          done

      - name: Run Evaluation Harness Against Quality Gate
        run: |
          python -m src.eval \
            --model mock-vllm-7b \
            --base-url http://localhost:8001/v1 \
            --test-file tests/fixtures/eval_regression_fixture.jsonl \
            --gate-config configs/eval_thresholds.yaml \
            --concurrency 4
